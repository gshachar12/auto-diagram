[pytest]
# Scoped to the Dataset Creator on purpose: the older suites under
# src/Preprocessor, src/Grounder and src/Evaluator need pyshark and a live
# tshark dissection path, and this milestone does not touch them. Run them
# explicitly with `pytest src/Preprocessor/tests` once those deps are in.
testpaths = src/Dataset/tests
pythonpath = src
addopts = -q
