<svg width="100%" viewBox="0 0 1002 780" role="img" xmlns="http://www.w3.org/2000/svg">
<title>ARP Spoofing MITM</title>
<desc>Three-phase sequence diagram of an ARP spoofing MITM attack showing directionality between actors.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    svg { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .actor-name { font-size:10px; font-weight:700; text-anchor:middle; }
    .actor-ip   { font-size:8px;  text-anchor:middle; }
    .lifeline   { stroke-width:1; stroke-dasharray:4 4; }
    .phase-label{ fill:#fff; text-anchor:middle; }
    .phase-title{ font-size:12px; font-weight:700; }
    .phase-sub  { font-size:9px; }
    .phase-bg   { opacity:0.4; }
    .badge-label{ fill:#fff; font-size:9px; font-weight:700; text-anchor:middle; }
    .lbl        { text-anchor:middle; }
    .lbl-main   { font-size:11px; font-weight:600; }
    .lbl-sub    { font-size:10px; }
    .annot-box  { fill:#fff; rx:3; }
    .annot-title{ font-size:9px; font-weight:700; fill:#333; }
    .annot-mono { font-size:9px; font-family:monospace; fill:#501313; }
    .poison-bar { fill:#fff0f0; stroke:#a32d2d; stroke-width:0.8; rx:3; }
    .poison-label{ font-size:9px; }
    .footer-box { fill:#faeeda; stroke:#854f0b; stroke-width:1; rx:4; }
    .footer-text{ font-size:12px; font-weight:700; fill:#412402; text-anchor:middle; }
  </style>
</defs>
<text x="500" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">ARP Spoofing MITM</text>

<g transform="translate(130,42)">
  <rect x="-55" y="0" width="110" height="52" rx="6" fill="#eaf3de" stroke="#639922" stroke-width="1.5"/>
  <image href="https://img.icons8.com/color/96/laptop.png" x="-18" y="2" width="36" height="36"/>
  <text x="0" y="42" class="actor-name" fill="#2a4a0a">Victim</text>
  <text x="0" y="49" class="actor-ip" fill="#3b6d11">192.168.1.104</text>
</g>
<g transform="translate(390,42)">
  <rect x="-55" y="0" width="110" height="52" rx="6" fill="#fcebeb" stroke="#a32d2d" stroke-width="1.5"/>
  <image href="https://img.icons8.com/color/96/evil.png" x="-18" y="2" width="36" height="36"/>
  <text x="0" y="42" class="actor-name" fill="#501313">Attacker (Kali)</text>
  <text x="0" y="49" class="actor-ip" fill="#a32d2d">192.168.1.105</text>
</g>
<g transform="translate(660,42)">
  <rect x="-55" y="0" width="110" height="52" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>
  <image href="https://img.icons8.com/color/96/router.png" x="-18" y="2" width="36" height="36"/>
  <text x="0" y="42" class="actor-name" fill="#042c53">Gateway</text>
  <text x="0" y="49" class="actor-ip" fill="#185fa5">192.168.1.1</text>
</g>
<g transform="translate(900,42)">
  <rect x="-55" y="0" width="110" height="52" rx="6" fill="#fff8ee" stroke="#854f0b" stroke-width="1.5"/>
  <image href="https://img.icons8.com/color/96/server.png" x="-18" y="2" width="36" height="36"/>
  <text x="0" y="42" class="actor-name" fill="#412402">Public Server</text>
  <text x="0" y="49" class="actor-ip" fill="#854f0b">reddit.com / gql</text>
</g>
<line x1="130" y1="97" x2="130" y2="730" class="lifeline" stroke="#639922"/>
<line x1="390" y1="97" x2="390" y2="730" class="lifeline" stroke="#f09595"/>
<line x1="660" y1="97" x2="660" y2="730" class="lifeline" stroke="#85b7eb"/>
<line x1="900" y1="97" x2="900" y2="730" class="lifeline" stroke="#fac775"/>
<rect x="8" y="110" width="112" height="130" rx="6" fill="#639922"/>
<text x="64" y="155" class="phase-label phase-title">Phase 1</text>
<text x="64" y="170" class="phase-label phase-sub">Legitimate</text>
<text x="64" y="182" class="phase-label phase-sub">Baseline</text>
<rect x="122" y="110" width="870" height="130" class="phase-bg" fill="#eaf3de"/>
<line x1="8" y1="240" x2="992" y2="240" stroke="#639922" stroke-width="0.5" stroke-dasharray="4 2"/>
<rect x="8" y="248" width="112" height="182" rx="6" fill="#a32d2d"/>
<text x="64" y="293" class="phase-label phase-title">Phase 2</text>
<text x="64" y="308" class="phase-label phase-sub">ARP Spoofing</text>
<text x="64" y="320" class="phase-label phase-sub">Execution</text>
<rect x="122" y="248" width="870" height="182" class="phase-bg" fill="#fff5f5"/>
<line x1="8" y1="430" x2="992" y2="430" stroke="#a32d2d" stroke-width="0.5" stroke-dasharray="4 2"/>
<rect x="8" y="438" width="112" height="262" rx="6" fill="#185fa5"/>
<text x="64" y="483" class="phase-label phase-title">Phase 3</text>
<text x="64" y="498" class="phase-label phase-sub">Traffic</text>
<text x="64" y="510" class="phase-label phase-sub">Interception</text>
<text x="64" y="522" class="phase-label phase-sub">& Sniffing</text>
<rect x="122" y="438" width="870" height="262" class="phase-bg" fill="#f0f6fc"/>
<line x1="8" y1="700" x2="992" y2="700" stroke="#185fa5" stroke-width="0.5" stroke-dasharray="4 2"/>
<circle cx="390" cy="128" r="8" fill="#639922"/>
<text x="390" y="132" class="badge-label">1.1</text>
<line x1="398" y1="130" x2="652" y2="147" stroke="#639922" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="525.0" y="133.5" class="lbl lbl-main" fill="#639922">DHCP Request → assigned 192.168.1.105</text>
<circle cx="660" cy="163" r="8" fill="#639922"/>
<text x="660" y="167" class="badge-label">1.2</text>
<line x1="652" y1="163" x2="398" y2="175" stroke="#639922" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="525.0" y="164.0" class="lbl lbl-main" fill="#639922">ARP: who has 192.168.1.105?</text>
<circle cx="130" cy="200" r="8" fill="#639922"/>
<text x="130" y="204" class="badge-label">1.3</text>
<line x1="138" y1="198" x2="382" y2="188" stroke="#639922" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="260.0" y="188.0" class="lbl lbl-main" fill="#639922">ARP: who has 192.168.1.1? (broadcast)</text>
<circle cx="390" cy="272" r="8" fill="#a32d2d"/>
<text x="390" y="276" class="badge-label">2.1</text>
<line x1="382" y1="274" x2="138" y2="292" stroke="#a32d2d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="260.0" y="278.0" class="lbl lbl-main" fill="#a32d2d">FORGED ARP Reply → Victim</text>
<text x="260.0" y="291.0" class="lbl lbl-sub" fill="#a32d2d">"192.168.1.1 is at 08:00:27:2d:f8:5a"</text>
<circle cx="390" cy="325" r="8" fill="#a32d2d"/>
<text x="390" y="329" class="badge-label">2.2</text>
<line x1="398" y1="327" x2="652" y2="344" stroke="#a32d2d" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="525.0" y="330.5" class="lbl lbl-main" fill="#a32d2d">FORGED ARP Reply → Gateway</text>
<text x="525.0" y="343.5" class="lbl lbl-sub" fill="#a32d2d">"192.168.1.104 is at 08:00:27:2d:f8:5a"</text>
<circle cx="130" cy="462" r="8" fill="#185fa5"/>
<text x="130" y="466" class="badge-label">3.1</text>
<line x1="138" y1="460" x2="382" y2="470" stroke="#185fa5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="260.0" y="460.0" class="lbl lbl-main" fill="#185fa5">DNS Query (UDP/53) — addressed to gateway</text>
<line x1="400" y1="476" x2="652" y2="488" stroke="#185fa5" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>
<text x="526.0" y="477.0" class="lbl lbl-sub" fill="#185fa5">Forwarded to real gateway (transparent)</text>
<circle cx="130" cy="530" r="8" fill="#185fa5"/>
<text x="130" y="534" class="badge-label">3.2</text>
<line x1="138" y1="528" x2="382" y2="540" stroke="#185fa5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="260.0" y="529.0" class="lbl lbl-main" fill="#185fa5">HTTP/HTTPS → reddit.com / gql.reddit.com</text>
<line x1="398" y1="545" x2="652" y2="556" stroke="#185fa5" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>
<text x="525.0" y="545.5" class="lbl lbl-sub" fill="#185fa5">→ gateway → internet</text>
<line x1="660" y1="556" x2="888" y2="568" stroke="#854f0b" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>
<text x="774.0" y="557.0" class="lbl lbl-sub" fill="#854f0b">→ server</text>
<circle cx="900" cy="608" r="8" fill="#185fa5"/>
<text x="900" y="612" class="badge-label">3.3</text>
<line x1="892" y1="606" x2="398" y2="618" stroke="#185fa5" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<text x="645.0" y="607.0" class="lbl lbl-main" fill="#185fa5">TLS Client Hello (clear-text header) + DigiCert cert</text>
<line x1="382" y1="622" x2="138" y2="610" stroke="#185fa5" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-dash)"/>
<text x="260.0" y="611.0" class="lbl lbl-sub" fill="#185fa5">TLS response relayed to victim</text>

<rect x="700" y="112" width="282" height="54" rx="4" class="annot-box" stroke="#639922" stroke-width="1"/>
<polygon points="700,132 692,137 700,142" fill="#639922"/>
<text x="714" y="128" class="annot-title">Victim cache (legitimate):</text>
<text x="714" y="141" class="annot-mono" style="fill:#333">192.168.1.1 → MAC-A (real gateway)</text>
<text x="714" y="154" class="annot-mono" style="fill:#639922">✓ Normal ARP state</text>

<circle cx="390" cy="375" r="8" fill="#a32d2d"/>
<text x="390" y="379" class="badge-label">2.3</text>
<path d="M398,375 C430,368 430,388 398,382" stroke="#a32d2d" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<text x="456" y="370" class="lbl-main" fill="#791f1f">ip_forward=1 (pre-configured) — transparent relay</text>
<text x="456" y="382" class="lbl-sub" fill="#555">All packets relayed to true destination → victim stays online</text>
<text x="456" y="394" class="lbl-sub" fill="#854f0b">Gratuitous ARP replayed every ~30 s to keep caches poisoned</text>

<rect x="122" y="410" width="868" height="14" rx="3" class="poison-bar"/>
<text x="132" y="420" class="poison-label" font-weight="700" fill="#333">Poisoned: </text>
<text x="186" y="420" class="poison-label" fill="#333">Victim: 192.168.1.1→08:00:27:2d:f8:5a  |  Gateway: 192.168.1.104→08:00:27:2d:f8:5a</text>
<text x="860" y="420" class="poison-label" font-weight="700" fill="#333">✔ MITM active</text>

<rect x="400" y="432" width="268" height="22" rx="3" class="annot-box" stroke="#185fa5" stroke-width="0.8"/>
<text x="410" y="440" class="annot-title">Plain-text intercept:</text>
<text x="410" y="451" class="annot-mono">QNAME: reddit.com | debian.pool.ntp.org</text>

<rect x="400" y="502" width="268" height="22" rx="3" class="annot-box" stroke="#185fa5" stroke-width="0.8"/>
<text x="410" y="510" class="annot-title">All packets captured &amp; saved</text>
<text x="410" y="521" class="annot-mono">SNI: reddit.com | gql.reddit.com (high volume)</text>

<rect x="350" y="632" width="480" height="46" rx="4" class="annot-box" stroke="#185fa5" stroke-width="1"/>
<text x="360" y="645" class="annot-title">Attacker reads from TLS Client Hello (unencrypted fields):</text>
<text x="360" y="657" class="annot-mono">SNI → reddit.com, gql.reddit.com  |  ALPN → h2 (HTTP/2)  |  DigiCert cert intercepted (public)</text>
<text x="360" y="669" class="annot-mono">Payload: [ENCRYPTED — cannot decrypt without private key]</text>


<rect x="8" y="710" width="984" height="30" rx="4" class="footer-box"/>
<text x="500" y="730" class="footer-text">MITM goal achieved — all traffic transparently proxied through Attacker. DNS &amp; TLS SNI exposed; payload remains encrypted.</text>

</svg>