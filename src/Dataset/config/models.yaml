# Panel members. `version` is an exact version string -- never an alias such
# as "latest", because an alias silently changes what the experiment ran on.
#
# API keys are read from the environment at call time (`api_key_env`) and are
# never stored in a config, a manifest or a result row.
#
# The real panel is still OPEN (which families/APIs, and which support tool
# calling). Only the mock panel below is usable today; it costs nothing and
# every test and the demo run on it.

models:
  - model_id: mock-a
    family: mock-alpha
    version: mock-alpha-1.0
    adapter: mock
    supports_tools: true
    temperature: 0.0
    api_key_env: null
  - model_id: mock-b
    family: mock-beta
    version: mock-beta-1.0
    adapter: mock
    supports_tools: true
    temperature: 0.0
    api_key_env: null
  - model_id: mock-c
    family: mock-gamma
    version: mock-gamma-1.0
    adapter: mock
    # Records a model with no tool support: reported as a format-error rate,
    # never silently dropped from the panel.
    supports_tools: false
    temperature: 0.0
    api_key_env: null

# ---------------------------------------------------------------------------
# Real providers. Each needs its key in the environment -- the value is read
# at call time and is never written to a config, a manifest, a result row or
# a log line.
#
# `model_name` is the exact version string the provider is called with. It
# ships as UNSET for the providers whose current identifiers were not
# verified here: an invented or aliased model name would make the run
# unreproducible, so the adapter refuses to call until it is filled in.
#
# Prices are null until confirmed against the provider's own page. A cost
# estimate from a made-up price is worse than no estimate.

  - model_id: claude-sonnet
    family: anthropic
    version: claude-sonnet-5-5
    adapter: anthropic
    model_name: claude-sonnet-5-5
    supports_tools: true
    temperature: 0.0
    api_key_env: ANTHROPIC_API_KEY
    price_per_mtok_in: null
    price_per_mtok_out: null

  - model_id: openai-primary
    family: openai
    version: UNSET
    adapter: openai
    model_name: UNSET
    supports_tools: true
    temperature: 0.0
    api_key_env: OPENAI_API_KEY
    price_per_mtok_in: null
    price_per_mtok_out: null

  - model_id: gemini-primary
    family: google
    version: UNSET
    adapter: google
    model_name: UNSET
    supports_tools: true
    temperature: 0.0
    api_key_env: GEMINI_API_KEY
    price_per_mtok_in: null
    price_per_mtok_out: null
