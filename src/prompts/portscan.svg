<svg width="100%" viewBox="0 0 1100 860" role="img" xmlns="http://www.w3.org/2000/svg">
<title>TCP SYN Port Scan — Representative Sequence (Open/Closed/Filtered)</title>
<desc>Sequence diagram visualizing a half-open TCP SYN scan showing open, closed, and filtered port outcomes.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>

  <style>
    svg { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }

    /* Actor boxes */
    .actor-box-scan { fill:#ffeaea; stroke:#FF4D4D; stroke-width:1.6; }
    .actor-box-fw   { fill:#eef2f7; stroke:#7a8da8; stroke-width:1.4; }
    .actor-box-tgt  { fill:#e9f3ff; stroke:#007ACC; stroke-width:1.6; }

    .actor-name     { font-size:11px; font-weight:700; text-anchor:middle; fill:#1a1a1a; }
    .actor-sub      { font-size:9px;  text-anchor:middle; fill:#555; }

    /* Lifelines */
    .lifeline       { stroke-width:1; stroke-dasharray:5 5; }
    .ll-scan        { stroke:#FF4D4D; }
    .ll-fw          { stroke:#98a6b8; }
    .ll-tgt         { stroke:#7fb6f0; }

    /* Phases */
    .phase-bar      { rx:6; fill:#111; }
    .phase-label    { fill:#fff; text-anchor:middle; }
    .phase-title    { font-size:12px; font-weight:700; }
    .phase-sub      { font-size:9px; opacity:0.9; }

    .phase-bg       { rx:4; opacity:0.35; }
    .bg-open        { fill:#ffeaea; }
    .bg-closed      { fill:#f4f7fb; }
    .bg-filtered    { fill:#eefbf3; }

    .div-open       { stroke:#FF4D4D; stroke-width:0.8; stroke-dasharray:4 3; }
    .div-closed     { stroke:#7a8da8; stroke-width:0.8; stroke-dasharray:4 3; }
    .div-filtered   { stroke:#1f9d55; stroke-width:0.8; stroke-dasharray:4 3; }

    /* Arrows */
    .arrow-scan     { stroke:#FF4D4D; stroke-width:2; fill:none; }
    .arrow-tgt      { stroke:#007ACC; stroke-width:1.8; fill:none; }
    .arrow-fw       { stroke:#1f9d55; stroke-width:1.8; fill:none; }
    .dash           { stroke-dasharray:5 4; }

    /* Labels over arrows */
    .lbl            { text-anchor:middle; fill:#1a1a1a; }
    .lbl-main       { font-size:11px; font-weight:600; }
    .lbl-sub        { font-size:9px; fill:#555; }

    /* Step badges */
    .badge          { }
    .b-open         { fill:#FF4D4D; }
    .b-closed       { fill:#7a8da8; }
    .b-filtered     { fill:#1f9d55; }
    .badge-label    { fill:#fff; font-weight:700; font-size:9px; text-anchor:middle; }

    /* Annotations */
    .annot          { fill:#fff; stroke:#ccc; stroke-width:1; rx:4; }
    .annot-title    { font-size:10px; font-weight:700; fill:#333; }
    .annot-text     { font-size:9px; fill:#333; }
    .mono           { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size:9px; fill:#333; }

    /* Footer */
    .footer-box     { fill:#fff7e6; stroke:#caa46a; stroke-width:1; rx:5; }
    .footer-text    { font-size:12px; font-weight:700; fill:#6b4d1f; text-anchor:middle; }

    /* Small glyphs */
    .drop-x         { stroke:#1f9d55; stroke-width:2; }
  </style>
</defs>

<!-- Title -->
<text x="550" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">TCP SYN Port Scan — Half-Open Technique</text>
<text x="550" y="44" text-anchor="middle" font-size="11" fill="#555">Representative packet patterns: open, closed, and filtered outcomes</text>

<!-- Actors -->
<!-- Scanner (x=150) -->
<g transform="translate(150,68)">
  <rect x="-65" y="0" width="130" height="56" rx="7" class="actor-box-scan"/>
  <image href="https://img.icons8.com/color/96/evil.png" x="-18" y="2" width="36" height="36"/>
  <text x="0" y="44" class="actor-name">Scanner</text>
  <text x="0" y="54" class="actor-sub">SYN Port Scan (attacker)</text>
</g>

<!-- Firewall/ACL (x=500) -->
<g transform="translate(500,68)">
  <rect x="-65" y="0" width="130" height="56" rx="7" class="actor-box-fw"/>
  <image href="https://img.icons8.com/color/96/firewall.png" x="-18" y="2" width="36" height="36"/>
  <text x="0" y="44" class="actor-name">Firewall/ACL</text>
  <text x="0" y="54" class="actor-sub">Perimeter control</text>
</g>

<!-- Target (x=850) -->
<g transform="translate(850,68)">
  <rect x="-65" y="0" width="130" height="56" rx="7" class="actor-box-tgt"/>
  <image href="https://img.icons8.com/color/96/server.png" x="-18" y="2" width="36" height="36"/>
  <text x="0" y="44" class="actor-name">Target Host</text>
  <text x="0" y="54" class="actor-sub">Single IP under scan</text>
</g>

<!-- Lifelines -->
<line x1="150" y1="124" x2="150" y2="790" class="lifeline ll-scan"/>
<line x1="500" y1="124" x2="500" y2="790" class="lifeline ll-fw"/>
<line x1="850" y1="124" x2="850" y2="790" class="lifeline ll-tgt"/>

<!-- Phase 1: Open-port pattern -->
<rect x="20" y="130" width="116" height="138" class="phase-bar"/>
<text x="78" y="162" class="phase-label phase-title">Phase 1</text>
<text x="78" y="178" class="phase-label phase-sub">Open-port</text>
<text x="78" y="194" class="phase-label phase-sub">pattern</text>
<rect x="136" y="130" width="944" height="138" class="phase-bg bg-open"/>
<line x1="20" y1="268" x2="1080" y2="268" class="div-open"/>

<!-- 1.1 SYN (Scanner -> Target) -->
<circle cx="150" cy="160" r="8" class="b-open"/>
<text x="150" y="164" class="badge-label">1.1</text>
<line x1="158" y1="160" x2="842" y2="160" class="arrow-scan" marker-end="url(#arrow)"/>
<text x="500" y="148" class="lbl lbl-main">TCP SYN → Representative open port</text>
<text x="500" y="160" class="lbl lbl-sub">No payload | Probe only</text>

<!-- 1.2 SYN-ACK (Target -> Scanner) -->
<circle cx="850" cy="200" r="8" class="b-open"/>
<text x="850" y="204" class="badge-label">1.2</text>
<line x1="842" y1="200" x2="158" y2="200" class="arrow-tgt dash" marker-end="url(#arrow-dash)"/>
<text x="500" y="188" class="lbl lbl-main">TCP SYN-ACK</text>
<text x="500" y="200" class="lbl lbl-sub">Indicates port is OPEN (listening)</text>

<!-- 1.3 RST (Scanner -> Target) -->
<circle cx="150" cy="240" r="8" class="b-open"/>
<text x="150" y="244" class="badge-label">1.3</text>
<line x1="158" y1="240" x2="842" y2="240" class="arrow-scan" marker-end="url(#arrow)"/>
<text x="500" y="228" class="lbl lbl-main">TCP RST</text>
<text x="500" y="240" class="lbl lbl-sub">Half-open scan aborts handshake to remain stealthy</text>

<!-- Phase 2: Closed-port pattern -->
<rect x="20" y="286" width="116" height="138" class="phase-bar"/>
<text x="78" y="318" class="phase-label phase-title">Phase 2</text>
<text x="78" y="334" class="phase-label phase-sub">Closed-port</text>
<text x="78" y="350" class="phase-label phase-sub">pattern</text>
<rect x="136" y="286" width="944" height="138" class="phase-bg bg-closed"/>
<line x1="20" y1="424" x2="1080" y2="424" class="div-closed"/>

<!-- 2.1 SYN (Scanner -> Target) -->
<circle cx="150" cy="316" r="8" class="b-closed"/>
<text x="150" y="320" class="badge-label">2.1</text>
<line x1="158" y1="316" x2="842" y2="316" class="arrow-scan" marker-end="url(#arrow)"/>
<text x="500" y="304" class="lbl lbl-main">TCP SYN → Representative closed port</text>
<text x="500" y="316" class="lbl lbl-sub">No service listening</text>

<!-- 2.2 RST (Target -> Scanner) -->
<circle cx="850" cy="356" r="8" class="b-closed"/>
<text x="850" y="360" class="badge-label">2.2</text>
<line x1="842" y1="356" x2="158" y2="356" class="arrow-tgt dash" marker-end="url(#arrow-dash)"/>
<text x="500" y="344" class="lbl lbl-main">TCP RST</text>
<text x="500" y="356" class="lbl lbl-sub">Indicates port is CLOSED</text>

<!-- (Spacer annotation) -->
<rect x="640" y="374" width="420" height="38" class="annot"/>
<text x="652" y="390" class="annot-title">Scanner classification logic (closed):</text>
<text x="652" y="402" class="mono">SYN → RST ⇒ state=closed</text>

<!-- Phase 3: Filtered-port pattern -->
<rect x="20" y="442" width="116" height="176" class="phase-bar"/>
<text x="78" y="474" class="phase-label phase-title">Phase 3</text>
<text x="78" y="490" class="phase-label phase-sub">Filtered-port</text>
<text x="78" y="506" class="phase-label phase-sub">pattern</text>
<rect x="136" y="442" width="944" height="176" class="phase-bg bg-filtered"/>
<line x1="20" y1="618" x2="1080" y2="618" class="div-filtered"/>

<!-- 3.1 SYN (Scanner -> Firewall/ACL) -->
<circle cx="150" cy="472" r="8" class="b-filtered"/>
<text x="150" y="476" class="badge-label">3.1</text>
<line x1="158" y1="472" x2="492" y2="472" class="arrow-scan" marker-end="url(#arrow)"/>
<text x="325" y="460" class="lbl lbl-main">TCP SYN → Representative filtered port</text>
<text x="325" y="472" class="lbl lbl-sub">Packet intercepted at perimeter</text>

<!-- Drop mark at Firewall -->
<line x1="500" y1="462" x2="500" y2="482" class="drop-x"/>
<line x1="490" y1="472" x2="510" y2="472" class="drop-x"/>
<text x="520" y="468" class="lbl lbl-sub" fill="#1f9d55">Drop: no forward to target</text>

<!-- 3.2 Retransmission (Scanner -> Firewall/ACL) -->
<circle cx="150" cy="512" r="8" class="b-filtered"/>
<text x="150" y="516" class="badge-label">3.2</text>
<line x1="158" y1="512" x2="492" y2="512" class="arrow-scan" marker-end="url(#arrow)"/>
<text x="325" y="500" class="lbl lbl-main">TCP SYN (retransmit)</text>
<text x="325" y="512" class="lbl lbl-sub">Probing for silence confirmation</text>

<!-- 3.3 No response (Timeout) -->
<circle cx="500" cy="552" r="8" class="b-filtered"/>
<text x="500" y="556" class="badge-label">3.3</text>
<text x="500" y="546" class="lbl lbl-main">No response observed</text>
<text x="500" y="558" class="lbl lbl-sub">Scanner infers FILTERED</text>

<!-- Right-side analysis panel -->
<rect x="136" y="636" width="944" height="86" class="annot"/>
<text x="150" y="652" class="annot-title">Scan characteristics (from report):</text>
<text x="150" y="667" class="mono">IPv4 + TCP only | Fixed src→dst IP | Rapidly mutating destination ports | No data payloads</text>
<text x="150" y="682" class="mono">Half-open method: SYN → {SYN-ACK ⇒ RST (open) | RST (closed) | silence/timeouts (filtered)}</text>
<text x="150" y="697" class="mono">Intent: enumerate open services and map attack surface</text>

<!-- Footer -->
<rect x="20" y="750" width="1060" height="40" class="footer-box"/>
<text x="550" y="774" class="footer-text">Reconnaissance detected: TCP SYN port scan. Apply rate-limits, tighten ACLs, and harden unused services.</text>

</svg>