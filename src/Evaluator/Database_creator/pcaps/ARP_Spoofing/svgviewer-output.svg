<svg width="100%" height="100%" viewBox="0 0 1000 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>ARP Spoofing Attack — Diagram</title>
  <desc>Compact sequence diagram showing the three core phases of an ARP spoofing MITM attack for article publication.</desc>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1a1a1a; }
    .phase-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #ffffff; }
    .node-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1a1a1a; }
    .node-sub { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #555555; }
    .pkt-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; }
    .info-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px;  fill: #222222; }
    .info-body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #444444; }
  </style>

  <text x="500" y="30" text-anchor="middle" class="title">ARP Spoofing MITM </text>

  <g transform="translate(150, 50)">
    <rect x="-50" y="0" width="100" height="60" rx="6" fill="#eaf3de" stroke="#639922" stroke-width="1.5"/>
  <image href="https://img.icons8.com/color/96/laptop.png" x="-15" y="[base_y+76]" width="30" height="30" opacity="0.5"/>

    <text x="0" y="40" text-anchor="middle" class="node-title">Victim</text>
    <text x="0" y="55" text-anchor="middle" class="info-title">192.168.1.104
</text>
  
  </g>
  <g transform="translate(416, 50)">
    <rect x="-50" y="0" width="100" height="60" rx="6" fill="#fcebeb" stroke="#a32d2d" stroke-width="1.5"/>
    <image href="https://img.icons8.com/color/96/evil.png" x="-15" y="[base_y+76]" width="30" height="30" opacity="0.5"/>
    <text x="0" y="40" text-anchor="middle" class="node-title">Kali-Attacker</text>
          <text x="0" y="55" text-anchor="middle" class="info-title"> 192.168.1.1
</text>
  </g>

  <g transform="translate(682, 50)">
    <rect x="-50" y="0" width="100" height="60" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="1.5"/>

 <image href="https://img.icons8.com/color/96/router.png" x="-15" y="[base_y+76]" width="30" height="30" opacity="0.5"/>
    <text x="0" y="40" text-anchor="middle" class="node-title">Gateway Router</text>
        <text x="0" y="55" text-anchor="middle" class="info-title">IP: 192.168.1.1
</text>
  </g>

  <g transform="translate(900, 50)">
    <rect x="-50" y="0" width="100" height="60" rx="6" fill="#faeeda" stroke="#854f0b" stroke-width="1.5"/>
 <image href="https://img.icons8.com/color/96/server.png" x="-15" y="[base_y+76]" width="30" height="30" opacity="0.5"/>
    <text x="0" y="40" text-anchor="middle" class="node-title">Public Server</text>
        <text x="0" y="55" text-anchor="middle" class="info-title">reddit.com · CDN
</text>
  </g>

  <line x1="150" y1="105" x2="150" y2="550" stroke="#639922" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="416" y1="105" x2="416" y2="550" stroke="#f09595" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="682" y1="105" x2="682" y2="550" stroke="#85b7eb" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="900" y1="105" x2="900" y2="550" stroke="#fac775" stroke-width="1" stroke-dasharray="4 4"/>


  <g transform="translate(0, 120)">
    <rect x="10" y="0" width="110" height="110" rx="6" fill="#639922"/>
    <text x="65" y="45" text-anchor="middle" class="phase-text">Phase 1</text>
    <text x="65" y="65" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#ffffff">Legitimate Baseline</text>
    <text x="65" y="78" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#ffffff">Initial Connection</text>
    
    <rect x="125" y="0" width="865" height="110" fill="#f6fbf0" rx="4" opacity="0.4"/>
    <line x1="10" y1="110" x2="990" y2="110" stroke="#639922" stroke-width="0.5" stroke-dasharray="4 2"/>

    <g transform="translate(150, 25)">
      <circle cx="0" cy="0" r="9" fill="#639922"/>
      <text x="0" y="3" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">1</text>

      
      <rect xmlns="http://www.w3.org/2000/svg" x="182" y="0" width="178" height="52" rx="5" fill="#fff" stroke="#639922" stroke-width="1.2"/>
      <text xmlns="http://www.w3.org/2000/svg" x="271" y="18" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#27500a">Connection to </text>
      <text xmlns="http://www.w3.org/2000/svg" x="271" y="33" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#3d3d3a">Broadcasts for IP address</text>
      <text xmlns="http://www.w3.org/2000/svg" x="271" y="46" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="11" fill="#639922">CHADDR = 08:00:27:b8:b7:58</text>

      
      <line x1="10" y1="0" x2="522" y2="0" stroke="#639922" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="200" y="-6" class="pkt-text" fill="#27500a">ARP Request: Who has 192.168.1.1?</text>
    </g>

    <g transform="translate(682, 65)">
      <line x1="-10" y1="0" x2="-522" y2="0" stroke="#639922" stroke-width="1.5" stroke-dasharray="3 1" marker-end="url(#arrow)"/>
      <text x="-260" y="-6" text-anchor="middle" class="pkt-text" fill="#27500a">ARP Reply: 192.168.1.1 is [MAC A]</text>
    </g>

    <g transform="translate(710, 20)">
      <path d="M0,0 L160,0 L170,10 L170,60 L0,60 Z" fill="#ffffff" stroke="#639922" stroke-width="1"/>
      <text x="10" y="18" class="info-title">Victim Cache:</text>
      <text x="10" y="35" class="info-body">from: [Router IP] -&gt; [MAC A]</text>
      <text x="10" y="48" class="info-body" fill="#639922">(Legitimate State Entry)</text>
    </g>
  </g>


  <g transform="translate(0, 250)">
    <rect x="10" y="0" width="110" height="130" rx="6" fill="#a32d2d"/>
    <text x="65" y="55" text-anchor="middle" class="phase-text">Phase 2</text>
    <text x="65" y="75" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#ffffff">(ARP Poisoning)</text>
    <text x="65" y="88" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#ffffff">(The Core)</text>
    
    <rect x="125" y="0" width="865" height="130" fill="#fff5f5" rx="4" opacity="0.4"/>
    <line x1="10" y1="130" x2="990" y2="130" stroke="#a32d2d" stroke-width="0.5" stroke-dasharray="4 2"/>

    <g transform="translate(416, 35)">
      <circle cx="-255" cy="-10" r="9" fill="#a32d2d"/>
      <text x="-255" y="-7" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">2</text>
      <path d="M 0,0 L -10,0 L -10,20 L -256,20" fill="none" stroke="#a32d2d" stroke-width="2" marker-end="url(#arrow)"/>

       <line x1="10" y1="130" x2="90" y2="100" stroke="#a32d2d" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="-130" y="12" text-anchor="middle" class="pkt-text" fill="#501313">FORGED ARP Reply: 192.168.1.1 is [MAC B] (Attacker MAC)</text>
    </g>

    <g transform="translate(416, 75)">
      <circle cx="0" cy="-1" r="9" fill="#a32d2d"/>
      <text x="0" y="2" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">3</text>
      <text x="15" y="-16" class="info-title" fill="#a32d2d">The Attack</text>
      <line x1="10" y1="0" x2="256" y2="0" stroke="#a32d2d" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="130" y="-6" text-anchor="middle" class="pkt-text" fill="#501313">FORGED ARP Reply: [Victim IP] is [MAC B]</text>
      
      <path d="M5,10 A8,8 0 1,1 -5,10" fill="none" stroke="#a32d2d" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="15" y="15" class="node-sub" font-weight="bold" fill="#a32d2d">Refresh every ~30s</text>
    </g>

    <g transform="translate(710, 25)">
      <path d="M0,0 L265,0 L275,10 L275,80 L0,80 Z" fill="#ffffff" stroke="#a32d2d" stroke-width="1.5"/>
      <text x="10" y="18" class="info-title" fill="#501313">POISONED CACHES:</text>
      <text x="10" y="38" class="info-body" font-weight="bold">Victim: [Router IP] -&gt; [MAC B] (Attacker)</text>
      <text x="10" y="54" class="info-body" font-weight="bold">Gateway: [Victim IP] -&gt; [MAC B] (Attacker)</text>
      <text x="10" y="70" class="info-body" fill="#a32d2d">✔ MITM Path Execution Established</text>
    </g>
  </g>


  <g transform="translate(0, 400)">
    <rect x="10" y="0" width="110" height="140" rx="6" fill="#185fa5"/>
    <text x="65" y="60" text-anchor="middle" class="phase-text">Phase 3</text>
    <text x="65" y="80" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="10" fill="#ffffff">(Interception)</text>
    
    <rect x="125" y="0" width="865" height="140" fill="#f0f6fc" rx="4" opacity="0.4"/>
    <line x1="10" y1="140" x2="990" y2="140" stroke="#185fa5" stroke-width="0.5" stroke-dasharray="4 2"/>

    <g transform="translate(150, 30)">
      <circle cx="-12" cy="0" r="9" fill="#185fa5"/>
      <text x="-12" y="3" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">4</text>
      <line x1="0" y1="0" x2="256" y2="0" stroke="#185fa5" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="110" y="-6" text-anchor="middle" class="pkt-text" fill="#042c53">DNS Query (addressed to Gateway)</text>
    </g>

    <g transform="translate(416, 30)">
      <circle cx="12" cy="-15" r="9" fill="#185fa5"/>
      <text x="12" y="-12" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">5</text>
      <text x="26" y="-11" class="info-title" fill="#185fa5">Forwarded Query</text>
      <line x1="0" y1="0" x2="256" y2="0" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
    </g>

    <g transform="translate(425, 45)">
      <path d="M0,10 L10,0 L510,0 L510,35 L0,35 Z" fill="#ffffff" stroke="#185fa5" stroke-width="1"/>
      <text x="15" y="15" class="info-title">Intercepted Traffic Callout (Kali Sees):</text>
      <text x="15" y="27" class="info-body" font-family="monospace" fill="#a32d2d">QNAME: debian.pool.ntp.org | reddit.com | SNI: reddit.com | Payload: (ENCRYPTED)'</text>
    </g>

    <g transform="translate(416, 105)">
      <circle cx="-12" cy="-15" r="9" fill="#185fa5"/>
      <text x="-12" y="-12" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">6</text>
      <text x="2" y="-11" class="info-title" fill="#185fa5">Intercepted Reply, Forwarded</text>
      <line x1="0" y1="0" x2="-256" y2="0" stroke="#185fa5" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
      
      <line x1="266" y1="0" x2="474" y2="0" stroke="#185fa5" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="240" y="-6" text-anchor="middle" class="pkt-text" fill="#042c53">Web Traffic (HTTP/HTTPS) Intercepted &amp; Forwarded</text>
      <text x="240" y="12" text-anchor="middle" class="node-sub" font-weight="bold" fill="#555555">Metadata Leak: Attacker sees SNI &amp; ALPN</text>
    </g>
  </g>

  <rect x="10" y="555" width="980" height="32" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="1"/>
  <text x="500" y="575" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" font-weight="bold" fill="#412402">MITM Goal Achieved: All traffic transparently proxy'd through Attacker.</text>

</svg>
